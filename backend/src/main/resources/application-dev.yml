spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fefo}
    username: ${DB_USERNAME:fefo}
    password: ${DB_PASSWORD:fefo}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-this-to-a-long-random-value-at-least-32-bytes}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  reservation:
    hold-minutes: ${RESERVATION_HOLD_MINUTES:15}
  lock:
    ttl-ms: ${LOCK_TTL_MS:30000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
