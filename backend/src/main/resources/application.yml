spring:
  application:
    name: fefo-inventory
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      timeout: 2s
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
